[project]
name = "meshlens"
version = "0.1.0"
description = "Mechanistic interpretability for 3D mesh transformers: separating spatial attention from sequence recency in MeshXL"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.2",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

# torch and transformers are only needed to extract attention, which runs on a
# CPU box (see scripts/setup_vm.sh). They are optional so that the dataset-level
# analyses -- scripts/confound_check.py and the whole test suite -- install and
# run anywhere without pulling a multi-hundred-megabyte wheel.
[project.optional-dependencies]
model = [
    "torch>=2.2",
    "transformers==4.44.2",
    "einops>=0.7",
    "huggingface-hub>=0.24",
    "accelerate>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meshlens"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
